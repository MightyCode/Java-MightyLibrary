name: CI

# Every push (topic branches included): the checks of a pull request are those of its last commit
on: push

jobs:
  test:
    # Fixed: the reference images of the driver (linux-mesa-llvmpipe) depend on the version of Mesa. A wanted change
    # of runner generates that series again in the same commit (tools/references.py --from-ci)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The tests tagged gl open a hidden window: a virtual screen (Xvfb) and the OpenGL of Mesa (llvmpipe, 3.3 core
      # and more). mightylib.test.requireGL: a test with GL fails without GL instead of being skipped
      - name: Virtual screen and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      # The runners have Intel or AMD processors: in the log, to explain a view that differs on one maker only
      - name: Processor of the runner
        run: lscpu | grep -E '^(Model name|Vendor ID)'
      # The demonstration pack (out of git, models/backpack of Scene3D): downloaded from its release, checked against
      # the sha256 of its manifest, kept in the cache while the manifest does not change
      - name: Cache of the demonstration pack
        uses: actions/cache@v4
        with:
          path: resources/models/backpack
          key: demo-assets-${{ hashFiles('tools/demo_assets.json') }}
      - name: Demonstration pack
        run: python3 tools/demo_assets.py
      # verify: the demo is compiled and tested against the jar of the library, as another project would use it.
      # Profile coverage: JaCoCo records every test of the three modules, the module coverage aggregates them
      # mightylib.test.requireDemoAssets: the smoke test of Scene3D fails without the pack instead of being skipped.
      # mightylib.test.requireReferences: an image test fails without the series of the driver instead of being skipped
      # llvmpipe compiles its shaders for the processor of the runner (vector width, FMA, AVX-512): the same instructions
      # on every runner, SSE 4.1 only, vectors of 128 bits (GLContextTest prints "llvmpipe (..., 128 bits)"). Intel and
      # AMD still round a few pixels differently: one series linux-mesa-llvmpipe for both (RendererKey), the view that
      # differs has its tolerance with its reason (ReferenceImagesGLTest)
      - name: Compile, test and package
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: sse4.1
          LP_NATIVE_VECTOR_WIDTH: 128
        run: >-
          xvfb-run -a mvn -B -P coverage verify -Dmightylib.test.requireGL=true -Dmightylib.test.requireDemoAssets=true
          -Dmightylib.test.requireReferences=true
      # The images of the failed comparisons (actual, expected, diff), per key: read them, or take the actual ones as
      # the new series with tools/references.py --from-ci
      - name: Images of the failed comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: references
          path: demo/target/references/
          if-no-files-found: ignore
      # The coverage per package in the summary of the job, then the floor of the lines (tools/coverage_floor.json,
      # raised by hand in the commit that adds tests)
      - name: Coverage summary
        run: python3 tools/coverage.py --no-run --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage floor
        run: python3 tools/coverage.py --no-run --check
      # The HTML report of the engine's coverage (python tools/coverage.py --from-ci), even when a test failed
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore
