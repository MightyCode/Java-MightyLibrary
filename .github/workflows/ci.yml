name: CI

# Every push (topic branches included): the checks of a pull request are those of its last commit
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The tests need neither a window nor OpenGL (see docs/debug-tools.md for the in-game checks)
      # verify: the demo is compiled and tested against the jar of the library, as another project would use it
      - name: Compile, test and package
        run: mvn -B verify
